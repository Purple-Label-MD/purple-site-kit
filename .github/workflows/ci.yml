name: CI

# Governance-lite ① — this repo's OWN law (no six-gate apparatus here):
#   build + lint + fail-closed copy-guard (proven RED-first) + link check
#   + per-page-meta check (proven RED-first) + INTAKE-SKIN-01 parity suite
#   (spec §7: logic unit tests + browser suite on both LAUNCH demo brands)
#   + the SPEC-CONTRACT instrument (WI-374 leg B).
#   Combined with founder-merge (governance-lite ②: bot-authored PRs, Gregg
#   merges, enforced by branch protection) this is the whole gate for the kit.
#
# WI-374 leg B — the projection instrument. Until it landed, every step in this
# file was SELF-REFERENTIAL: not one of them compared this kit to the platform it
# integrates with. That is how a called path the spec does not publish, a base-URL
# convention documented two ways, and three vocabularies for one entry mode all
# survived four integrator walks. `spec:contract` closes that by projecting the
# published API surface onto this repo's code and docs, fail-closed; `spec:heartbeat`
# closes the OTHER failure — a gate that quietly stops ruling — by refusing to pass
# when no live verification has concluded inside the freshness window.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # the jam detector reads THIS repo's own workflow-run history; nothing else needs it
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      # RED-first proof: asserts each NEVER-list rule fires on a planted violation
      # AND that the real tree is clean. Fails closed if a rule is weakened.
      - name: Copy-guard self-test (RED-first + green)
        run: npm run copy-guard:test

      # INTAKE-SKIN-01 deterministic interaction rules (T2/T3/T3b/gating, INT-A-07).
      - name: Intake parity — logic unit tests
        run: npm run parity:logic

      # Anti-clone projection proof: shared line → both audience lenses,
      # exclusive → exactly one.
      - name: Catalog projection self-test
        run: npm run catalog:test

      # RED-first proof of the per-page-meta law (the addendum §4① failure mode):
      # missing / default / duplicate meta must all fire.
      - name: Meta-check self-test (RED-first + green)
        run: npm run meta-check:test

      # RED-first proof of the spec-anchored instrument: a planted dead call path and a
      # planted doubled base must BOTH fail, the register must red on an expired or a
      # stale entry, a census below its floor must read as JAMMED rather than as a pass,
      # and LIVE-FETCH-FAILED must stay distinct from SURFACE-DRIFT. A check that has only
      # ever been green proves nothing.
      - name: Spec-contract self-test (RED-first + green)
        run: npm run spec:contract:test

      # The instrument itself, against the pinned published surface. Fail-closed.
      - name: Spec-contract (spec-anchored, fail-closed)
        run: npm run spec:contract

      # THE JAM DETECTOR. A fail-closed gate that stops ruling is a silent lie — the
      # platform's own docs-projection sat red on main for days with publishing frozen and
      # nothing said so. This step refuses to pass when no live verification has concluded
      # inside the freshness window declared in integration-contract.json.
      - name: Spec-contract jam detector (live verification must be fresh)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run spec:heartbeat

      - name: Copy-guard scan (fail-closed)
        run: npm run copy-guard

      # Build the GROWTH demo brand (superset of routes: storefront + labs + shared
      # pages) so the crawl-based checks cover the estate where the meta law matters.
      - name: Build (growth demo brand)
        run: npm run build:demo

      # Boots the built app in credential-free mock mode and crawls internal links.
      - name: Link check
        run: npm run link-check

      # Boots the built app and fails closed on any duplicate/default/missing per-page
      # meta or OG (the addendum §4① failure fixed with two live proofs).
      - name: Per-page-meta check (fail-closed)
        run: npm run meta-check

      # Browser-level parity (spec §7): T1 auto-advance, T4 completion/bar/back,
      # T5 reduced-motion instant, settled computed-style audit (#6D28D9 default).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The two parity runs double as the two-LAUNCH-brand theming proof: each brand
      # is built AND its intake accent audited in-browser (a strict superset of the
      # bare build:brands insurance step this replaces).
      - name: Build (aurora demo brand, BRAND-01 default)
        run: npm run build

      - name: Intake parity — browser suite (BRAND-01 default)
        run: npm run parity:full

      # Two-brand retheme proof (tokens only): rebuild peer, re-audit the accent.
      - name: Build (peer demo brand)
        run: npm run build:peer

      - name: Intake parity — retheme audit (peer tokens)
        run: npm run parity:retheme
